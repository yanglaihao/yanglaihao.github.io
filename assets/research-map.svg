<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">Research map visual</title>
  <desc id="desc">An abstract academic workspace showing papers, datasets, and collaboration nodes.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#eef5f1" />
    </linearGradient>
    <linearGradient id="darkPaper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#213028" />
      <stop offset="1" stop-color="#17231d" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#123025" flood-opacity=".14" />
    </filter>
  </defs>

  <rect width="960" height="720" fill="#eaf1ed" />
  <path d="M0 590 C180 520 260 670 430 600 C620 520 705 570 960 500 L960 720 L0 720 Z" fill="#d8e6df" />

  <g opacity=".55" stroke="#9ab3a9" stroke-width="2">
    <path d="M115 500 C260 330 380 410 510 250 S760 150 835 265" fill="none" />
    <path d="M170 215 C300 310 415 125 560 205 S740 330 800 185" fill="none" />
    <path d="M205 565 C350 470 510 520 640 380 S735 250 865 320" fill="none" />
  </g>

  <g filter="url(#shadow)">
    <rect x="88" y="108" width="250" height="304" rx="8" fill="url(#paper)" stroke="#c7d8cf" />
    <rect x="118" y="142" width="78" height="12" fill="#0b6b57" opacity=".9" />
    <rect x="118" y="180" width="178" height="9" fill="#78948a" opacity=".65" />
    <rect x="118" y="204" width="150" height="9" fill="#78948a" opacity=".5" />
    <rect x="118" y="250" width="170" height="90" fill="#d8e6df" />
    <path d="M136 316 L172 282 L205 306 L238 270 L270 298" fill="none" stroke="#315f9a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <g filter="url(#shadow)">
    <rect x="385" y="72" width="332" height="218" rx="8" fill="#173229" />
    <rect x="416" y="108" width="118" height="12" fill="#66d2b0" />
    <rect x="416" y="142" width="238" height="8" fill="#abc7bc" opacity=".6" />
    <rect x="416" y="164" width="196" height="8" fill="#abc7bc" opacity=".45" />
    <circle cx="472" cy="222" r="28" fill="#66d2b0" />
    <circle cx="552" cy="210" r="18" fill="#e39a78" />
    <circle cx="625" cy="232" r="24" fill="#8eb7ef" />
    <path d="M498 218 L534 212 M570 216 L601 226" stroke="#abc7bc" stroke-width="3" />
