      <rect x="60" width="46" height="46" fill="#dcebe6" />
      <rect x="120" width="46" height="46" fill="#dcebe6" />
      <rect x="180" width="46" height="46" fill="#dcebe6" />
      <circle cx="23" cy="23" r="9" fill="#0b6b57" />
      <circle cx="83" cy="23" r="13" fill="#315f9a" />
      <circle cx="143" cy="23" r="7" fill="#b4532f" />
