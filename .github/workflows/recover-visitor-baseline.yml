name: Preserve visitor statistics

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/recover-visitor-baseline.yml
      - .github/scripts/backup-visitor-stats.py
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: preserve-visitor-statistics
  cancel-in-progress: false

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - name: Read live totals and retry missing historical data
        run: python3 .github/scripts/backup-visitor-stats.py

      - name: Verify saved totals and fallback behavior
        run: |
          node tests/visitor-stats-checks.js
          python3 tests/visitor-backup-checks.py

      - name: Save the verified statistics
        id: save
        shell: bash
        run: |
          if git diff --quiet -- visitor-baseline.json index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add visitor-baseline.json index.html
          git commit -m 'fix: preserve cumulative visitor statistics'
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish the saved statistics
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --jq '.status'
